<!doctype html>
{% load static %}
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | BetPilot</title>
    <link rel="stylesheet" href="{% static 'dashboard/styles.css' %}" />
  </head>
  <body>
    <main class="standalone-page">
      <article class="panel standalone-card auth-card">
        <div class="brand auth-brand">
          <span class="brand-mark">BP</span>
          <div>
            <strong>BetPilot</strong>
            <small>Entrar na sua conta</small>
          </div>
        </div>

        <form class="bet-form" method="post" novalidate>
          {% csrf_token %}
          {% if form.non_field_errors %}
            <div class="form-errors">{{ form.non_field_errors }}</div>
          {% endif %}

          <label>
            <span>Usuario</span>
            {{ form.username }}
            {{ form.username.errors }}
          </label>

          <label>
            <span>Senha</span>
            {{ form.password }}
            {{ form.password.errors }}
          </label>

          <button class="primary-button" type="submit">Entrar</button>
          <a class="ghost-button link-button subtle-link" href="{% url 'dashboard:signup' %}">Criar conta</a>
        </form>
      </article>
    </main>
  </body>
</html>
