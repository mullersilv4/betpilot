<!doctype html>
{% load static %}
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email enviado | BetPilot</title>
    <link rel="stylesheet" href="{% static 'dashboard/styles.css' %}" />
  </head>
  <body>
    <main class="standalone-page">
      <article class="panel standalone-card auth-card">
        <div class="brand auth-brand">
          <span class="brand-mark">BP</span>
          <div>
            <strong>BetPilot</strong>
            <small>Email enviado</small>
          </div>
        </div>

        <p class="muted-copy">Se o email estiver cadastrado, você recebera um link para criar uma nova senha.</p>
        <div class="auth-actions">
          <a class="primary-button link-button" href="{% url 'dashboard:login' %}">Voltar para login</a>
        </div>
      </article>
    </main>
  </body>
</html>
