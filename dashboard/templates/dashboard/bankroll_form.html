<!doctype html>
{% load static %}
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurar banca | BetPilot</title>
    <link rel="stylesheet" href="{% static 'dashboard/styles.css' %}" />
  </head>
  <body>
    <main class="standalone-page">
      <article class="panel standalone-card">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Banca</p>
            <h1>Editar {{ bankroll.entity.name|default:bankroll.name }}</h1>
          </div>
          <a class="ghost-button compact link-button subtle-link" href="{% url 'dashboard:index' %}#bankroll">Voltar</a>
        </div>

        <form class="bet-form" method="post" novalidate>
          {% csrf_token %}

          {% if form.non_field_errors %}
            <div class="form-errors">{{ form.non_field_errors }}</div>
          {% endif %}

          <label>
            <span>Entidade</span>
            {{ form.entity }}
            {{ form.entity.errors }}
          </label>

          <div class="form-row">
            <label>
              <span>Casa ou exchange</span>
              {{ form.bookmaker }}
              {{ form.bookmaker.errors }}
            </label>
          </div>

          <div class="form-row">
            <label>
              <span>Saldo inicial</span>
              {{ form.initial_balance }}
              {{ form.initial_balance.errors }}
            </label>
          </div>

          <button class="primary-button" type="submit">Salvar banca</button>
        </form>
      </article>
    </main>
  </body>
</html>
