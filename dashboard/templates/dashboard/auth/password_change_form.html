<!doctype html>
{% load static %}
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trocar senha | BetPilot</title>
    <link rel="stylesheet" href="{% static 'dashboard/styles.css' %}" />
  </head>
  <body>
    <main class="standalone-page">
      <article class="panel standalone-card auth-card">
        <div class="brand auth-brand">
          <span class="brand-mark">BP</span>
          <div>
            <strong>BetPilot</strong>
            <small>Trocar senha</small>
          </div>
        </div>

        <form class="bet-form" method="post" novalidate>
          {% csrf_token %}
          {% if form.non_field_errors %}
            <div class="form-errors">{{ form.non_field_errors }}</div>
          {% endif %}

          <label>
            <span>Senha atual</span>
            {{ form.old_password }}
            {{ form.old_password.errors }}
          </label>

          <label>
            <span>Nova senha</span>
            {{ form.new_password1 }}
            {{ form.new_password1.errors }}
          </label>

          <label>
            <span>Confirmar nova senha</span>
            {{ form.new_password2 }}
            {{ form.new_password2.errors }}
          </label>

          <button class="primary-button" type="submit">Salvar nova senha</button>
          <a class="ghost-button link-button subtle-link" href="{% url 'dashboard:index' %}">Voltar ao dashboard</a>
        </form>
      </article>
    </main>
  </body>
</html>
