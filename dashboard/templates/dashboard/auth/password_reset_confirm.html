<!doctype html>
{% load static %}
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova senha | Freebetar</title>
    <link rel="stylesheet" href="{% static 'dashboard/styles.css' %}?v=20260602-1" />
  </head>
  <body>
    <main class="standalone-page">
      <article class="panel standalone-card auth-card">
        <div class="brand auth-brand">
          <span class="brand-mark">FB</span>
          <div>
            <strong>Freebetar</strong>
            <small>Nova senha</small>
          </div>
        </div>

        {% if validlink %}
          <form class="bet-form" method="post" novalidate>
            {% csrf_token %}
            {% if form.non_field_errors %}
              <div class="form-errors">{{ form.non_field_errors }}</div>
            {% endif %}

            <label>
              <span>Nova senha</span>
              {{ form.new_password1 }}
              {{ form.new_password1.errors }}
            </label>

            <label>
              <span>Confirmar nova senha</span>
              {{ form.new_password2 }}
              {{ form.new_password2.errors }}
            </label>

            <button class="primary-button" type="submit">Salvar nova senha</button>
          </form>
        {% else %}
          <p class="muted-copy">Este link de recuperação expirou ou já foi usado.</p>
          <a class="primary-button link-button" href="{% url 'dashboard:password_reset' %}">Solicitar novo link</a>
        {% endif %}
      </article>
    </main>
  </body>
</html>
