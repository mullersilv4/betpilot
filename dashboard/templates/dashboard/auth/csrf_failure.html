<!doctype html>
{% load static %}
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sessao expirada | BetPilot</title>
    <link rel="stylesheet" href="{% static 'dashboard/styles.css' %}" />
  </head>
  <body>
    <main class="standalone-page">
      <article class="panel standalone-card auth-card">
        <div class="brand auth-brand">
          <span class="brand-mark">BP</span>
          <div>
            <strong>Sessao expirada</strong>
            <small>Recarregue o formulario e tente novamente</small>
          </div>
        </div>

        <p class="muted-copy">
          O Django recusou o envio porque o token de seguranca do formulario ficou antigo.
        </p>

        <div class="topbar-actions auth-actions">
          <a class="primary-button link-button" href="{% url 'dashboard:signup' %}">Criar conta</a>
          <a class="ghost-button link-button subtle-link" href="{% url 'dashboard:login' %}">Entrar</a>
        </div>
      </article>
    </main>
  </body>
</html>
