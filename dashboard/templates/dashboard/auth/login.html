<!doctype html>
{% load static %}
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Freebetar</title>
    <link rel="stylesheet" href="{% static 'dashboard/styles.css' %}?v=20260602-1" />
  </head>
  <body>
    <main class="standalone-page">
      <article class="panel standalone-card auth-card">
        <div class="brand auth-brand">
          <span class="brand-mark">FB</span>
          <div>
            <strong>Freebetar</strong>
            <small>Entrar na sua conta</small>
          </div>
        </div>

        <form class="bet-form" method="post" novalidate>
          {% csrf_token %}
          {% if form.non_field_errors %}
            <div class="form-errors">{{ form.non_field_errors }}</div>
          {% endif %}

          <label>
            <span>Usuário</span>
            {{ form.username }}
            {{ form.username.errors }}
          </label>

          <label>
            <span>Senha</span>
            {{ form.password }}
            {{ form.password.errors }}
          </label>

          <button class="primary-button" type="submit">Entrar</button>
          <div class="auth-actions">
            <a class="ghost-button link-button subtle-link" href="{% url 'dashboard:password_reset' %}">Esqueci minha senha</a>
            <a class="ghost-button link-button subtle-link" href="{% url 'dashboard:signup' %}">Criar conta</a>
          </div>
        </form>
      </article>
    </main>
  </body>
</html>
